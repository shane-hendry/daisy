title = "静かな街を歩く"
feed_link_title = "サンプルジャーナル"
feed_link = "https://example.org/"
preferred_link = "https://example.org/ja"
byline = "山田 花子"
date_medium = "2026年10月20日"
body = '''<p>扉が開く前、街はパン屋とバスの運転手、そして煉瓦の壁に差す最初の温かな光のものだった。川へ向かって長い道を歩くと、プラタナスの並木が歩道に揺れる模様を描いていた。</p>
<blockquote><p>見慣れた通りも、時間をかければ新しく見えてくる。</p></blockquote>
<p>九時にはカフェが人でいっぱいになり、朝の魔法はやわらいでいた。忘れないように小さな三つのことを書き留めた。緑のタイル、ほうきの音、橋の下をくるくる回る紙の舟。</p>'''
