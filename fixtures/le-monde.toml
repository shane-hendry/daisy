body = '''<p>La Saudi Pro League a comptabilisé un but à la superstar portugaise lors de la victoire de son club d’Al-Nassr face à Al-Faisaly, vendredi. Mais celui-ci aurait en réalité été marqué par un défenseur adverse.</p><p>Un second paragraphe court garde le contrôle de lisibilité satisfait.</p>'''
