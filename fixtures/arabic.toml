body = '''<p style="text-align: center;">قبل أن تفتح الأبواب، كانت المدينة ملكًا للخبازين وسائقي الحافلات وأول ضوء دافئ على الطوب. مشيت الطريق الطويل نحو النهر، وكانت صفوف الأشجار ترسم نمطًا متحركًا على الرصيف.</p>
<blockquote><p>الشارع المألوف يصبح جديدًا حين تمنحه وقتًا كافيًا.</p></blockquote>
<p>في التاسعة كانت المقاهي قد امتلأت وخفّ سحر الصباح. دوّنت ثلاثة تفاصيل صغيرة لأتذكرها: البلاط الأخضر، وصوت المكنسة، وقارب ورقي يدور تحت الجسر.</p>'''
