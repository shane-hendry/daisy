otojournal/pia/pia25/pia25629/PIA25629.png?w=2000&amp;h=373&amp;fit=crop&amp;crop=faces%2Cfocalpoint 2000w" sizes="auto, (max-width: 6737px) 100vw, 6737px" loading="lazy"/><figcaption>PIA25629. Credit: NASA/JPL-Caltech/MSSS</figcaption></figure>				
			
		
		
				
			
								
							
		
			



	
		

					
					
			

	






<p>NASA’s Curiosity Mars rover captured this panorama of sunrise illuminating distant, wind-carved features called yardangs on Aug. 11, 2026, the 4,982nd Martian day, or sol, of the mission. Scientists are eager to learn more about how the yardang layer formed. </p>


<figure><a href="https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=1837&amp;h=1006&amp;fit=clip&amp;crop=faces%2Cfocalpoint" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank"><img decoding="async" width="1837" height="1006" src="https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=1837&amp;h=1006&amp;fit=clip&amp;crop=faces%2Cfocalpoint" alt="A panoramic view of a stark, grayish-tan Martian landscape featuring jagged rock formations and rolling mountain ridges beneath a pale, hazy sky." srcset="https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=1837&amp;h=1006&amp;fit=crop&amp;crop=faces%2Cfocalpoint 1837w, https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=300&amp;h=164&amp;fit=crop&amp;crop=faces%2Cfocalpoint 300w, https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=768&amp;h=421&amp;fit=crop&amp;crop=faces%2Cfocalpoint 768w, https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=1024&amp;h=561&amp;fit=crop&amp;crop=faces%2Cfocalpoint 1024w, https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=1536&amp;h=841&amp;fit=crop&amp;crop=faces%2Cfocalpoint 1536w, https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=400&amp;h=219&amp;fit=crop&amp;crop=faces%2Cfocalpoint 400w, https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=600&amp;h=329&amp;fit=crop&amp;crop=faces%2Cfocalpoint 600w, https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=900&amp;h=493&amp;fit=crop&amp;crop=faces%2Cfocalpoint 900w, https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25629/figures/PIA25629_figA.png?w=1200&amp;h=657&amp;fit=crop&amp;crop=faces%2Cfocalpoint 1200w" sizes="auto, (max-width: 1837px) 100vw, 1837px" loading="lazy"/></a><figcaption>Figure A</figcaption></figure>


<p>Figure A is a crop zooming in on the distant yardangs.</p>



<p>Since 2014, Curiosity has been ascending 3-mile-tall (5-kilometer-tall) Mount Sharp, which is made up of a series of distinct layers that were deposited one on top of the other. In the area of the vast mountain’s shoulder where the rover is climbing, that stack of layers ends with the yardang layer. Before the yardang layer was laid down, Mount Sharp may have begun eroding, creating a gap in the otherwise continuous record of climate history that Curiosity has been reading from the layers. Scientists aren’t entirely sure how the layer formed; one theory is that it’s a pile of volcanic ash, similar to what’s seen along the Red Planet’s equator.</p>



<p>This panorama was captured by Curiosity’s Mastcam and is made up six individual images that were stitched together after being sent back to Earth. Unlike most of Curiosity’s Mastcam images, this one was processed without the usual white balancing, an artistic choice that preserves the early morning appearance.</p>



<p>Curiosity was built by NASA’s Jet Propulsion Laboratory, which is managed by Caltech in Pasadena, California. JPL leads the mission on behalf of NASA’s Science Mission Directorate in Washington as part of NASA’s Mars Exploration Program portfolio. Malin Space Science Systems in San Diego built and operates Mastcam.</p>



