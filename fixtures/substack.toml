title = 'Why the bus is late, what it quietly costs everyone who rides it, and the three fixes that actually work'
body = '''
<div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" target="_blank" href="https://example.org/image/fetch/w_1456/bus-stop.jpeg" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://example.org/image/fetch/w_424,f_webp/bus-stop.jpeg 424w, https://example.org/image/fetch/w_848,f_webp/bus-stop.jpeg 848w, https://example.org/image/fetch/w_1272,f_webp/bus-stop.jpeg 1272w, https://example.org/image/fetch/w_1456,f_webp/bus-stop.jpeg 1456w" sizes="100vw"><img src="https://example.org/image/fetch/w_1456,f_auto/bus-stop.jpeg" width="1456" height="971" data-attrs="{&quot;src&quot;:&quot;https://example.org/public/images/bus-stop_2048x1366.jpeg&quot;,&quot;srcNoWatermark&quot;:null,&quot;fullscreen&quot;:null,&quot;imageSize&quot;:null,&quot;height&quot;:971,&quot;width&quot;:1456,&quot;resizeWidth&quot;:null,&quot;bytes&quot;:402119,&quot;alt&quot;:null,&quot;title&quot;:null,&quot;type&quot;:&quot;image/jpeg&quot;,&quot;href&quot;:null,&quot;belowTheFold&quot;:false,&quot;topImage&quot;:true,&quot;internalRedirect&quot;:null,&quot;isProcessing&quot;:false,&quot;align&quot;:null,&quot;offset&quot;:false}" class="sizing-normal" alt="" srcset="https://example.org/image/fetch/w_424,f_auto/bus-stop.jpeg 424w, https://example.org/image/fetch/w_848,f_auto/bus-stop.jpeg 848w, https://example.org/image/fetch/w_1272,f_auto/bus-stop.jpeg 1272w, https://example.org/image/fetch/w_1456,f_auto/bus-stop.jpeg 1456w" sizes="100vw" fetchpriority="high"></picture><div class="image-link-expand"><div class="pencraft pc-display-flex pc-gap-8 pc-reset"><button tabindex="0" type="button" class="pencraft pc-reset pencraft icon-container restack-image buttonBase-GK1x3M"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke="var(--color-fg-primary)" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" class="icon-noB79L"><g><path d="M2.53001 7.81595C3.49179 4.73911 6.43281 2.5 9.91173 2.5C13.1684 2.5 15.9537 4.46214 17.0852 7.23684L17.6179 8.67647M17.6179 8.67647L18.5002 4.26471M17.6179 8.67647L13.6473 6.91176M17.4995 12.1841C16.5378 15.2609 13.5967 17.5 10.1178 17.5C6.86118 17.5 4.07589 15.5379 2.94432 12.7632L2.41165 11.3235M2.41165 11.3235L1.5293 15.7353M2.41165 11.3235L6.38224 13.0882"></path></g></svg></button><button tabindex="0" type="button" class="pencraft pc-reset pencraft icon-container view-image buttonBase-GK1x3M"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-maximize2 lucide-maximize-2 icon-noB79L"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" x2="14" y1="3" y2="10"></line><line x1="3" x2="10" y1="21" y2="14"></line></svg></button></div></div></div></a><figcaption class="image-caption">Riders waiting at a stop on a route that is scheduled every ten minutes and arrives, on average, every seventeen. Photo by the author.</figcaption></figure></div><p><span>Every transit agency publishes a schedule, and every rider learns how far to trust it.</span><a class="footnote-anchor" data-component-name="FootnoteAnchorToDOM" id="footnote-anchor-1" href="#footnote-1" target="_self">1</a><span> The gap between the two is where most of the cost of a late bus hides: not in the minutes themselves, but in the slack people build into their days to absorb them.</span></p><p>This week I want to walk through where that slack comes from, how to put a number on it, and which fixes cities have tried that measurably shrink it.<a class="footnote-anchor" data-component-name="FootnoteAnchorToDOM" id="footnote-anchor-2" href="#footnote-2" target="_self">2</a></p><div class="subscription-widget-wrap-editor" data-attrs="{&quot;url&quot;:&quot;https://example.org/subscribe?&quot;,&quot;text&quot;:&quot;Subscribe&quot;,&quot;language&quot;:&quot;en&quot;}" data-component-name="SubscribeWidgetToDOM"><div class="subscription-widget show-subscribe"><div class="preamble"><p class="cta-caption">The Commonplace Dispatch is reader-supported. To receive new posts and support the work, consider becoming a free or paid subscriber.</p></div><form class="subscription-widget-subscribe"><input type="email" class="email-input" name="email" placeholder="Type your email&#8230;" tabindex="-1"><input type="submit" class="button primary" value="Subscribe"><div class="fake-input-wrapper"><div class="fake-input"></div><div class="fake-button"></div></div></form></div></div><h3>Where the minutes go</h3><p>A bus that runs late at the start of its route rarely catches up. Each stop adds a little dwell time, and a crowded bus dwells longer, so the delay compounds as the trip goes on. The chart below shows one route’s average delay by stop over a month of weekday mornings.</p><div class="captioned-image-container"><figure><a class="image-link image2" target="_blank" href="https://example.org/image/fetch/w_1456/delay-by-stop.png" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://example.org/image/fetch/w_424,f_webp/delay-by-stop.png 424w, https://example.org/image/fetch/w_848,f_webp/delay-by-stop.png 848w, https://example.org/image/fetch/w_1272,f_webp/delay-by-stop.png 1272w, https://example.org/image/fetch/w_1456,f_webp/delay-by-stop.png 1456w" sizes="100vw"><img src="https://example.org/image/fetch/w_1456,f_auto/delay-by-stop.png" width="1456" height="49" data-attrs="{&quot;src&quot;:&quot;https://example.org/public/images/delay-by-stop_1456x49.png&quot;,&quot;height&quot;:49,&quot;width&quot;:1456,&quot;type&quot;:&quot;image/png&quot;,&quot;belowTheFold&quot;:true,&quot;topImage&quot;:false,&quot;isProcessing&quot;:false,&quot;align&quot;:null,&quot;offset&quot;:false}" class="sizing-normal" alt="" title="" srcset="https://example.org/image/fetch/w_424,f_auto/delay-by-stop.png 424w, https://example.org/image/fetch/w_848,f_auto/delay-by-stop.png 848w, https://example.org/image/fetch/w_1272,f_auto/delay-by-stop.png 1272w, https://example.org/image/fetch/w_1456,f_auto/delay-by-stop.png 1456w" sizes="100vw" loading="lazy"></picture><div></div></div></a></figure></div><p>The pattern is the same on nearly every route we looked at: a small delay at the first few stops, then a steady climb.</p><div class="pullquote"><p>The cost of a late bus is not the minutes it loses. It is the minutes everyone adds to their day in case it does.</p></div><p>A narrow image stays at its own size rather than stretching to the column:</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" target="_blank" href="https://example.org/image/fetch/w_616/route-map.jpeg" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://example.org/image/fetch/w_424,f_webp/route-map.jpeg 424w, https://example.org/image/fetch/w_848,f_webp/route-map.jpeg 848w" sizes="100vw"><img src="https://example.org/image/fetch/w_616,f_auto/route-map.jpeg" width="616" height="452" data-attrs="{&quot;src&quot;:&quot;https://example.org/public/images/route-map_616x452.jpeg&quot;,&quot;height&quot;:452,&quot;width&quot;:616,&quot;type&quot;:&quot;image/jpeg&quot;,&quot;belowTheFold&quot;:true,&quot;topImage&quot;:false,&quot;isProcessing&quot;:false,&quot;align&quot;:null,&quot;offset&quot;:false}" class="sizing-normal" alt="" srcset="https://example.org/image/fetch/w_424,f_auto/route-map.jpeg 424w, https://example.org/image/fetch/w_848,f_auto/route-map.jpeg 848w" sizes="100vw" loading="lazy"></picture><div></div></div></a><figcaption class="image-caption">The route, with the three stops where most of the delay starts.</figcaption></figure></div><h3>Three fixes that work</h3><ol><li><p><strong>Board at every door.</strong> Letting riders tap on at the back cuts dwell time at busy stops by a third.</p></li><li><p><strong>Paint the lane.</strong> A bus lane only helps if it is kept clear, but even a painted one changes where drivers stop.</p></li><li><p><strong>Hold the signal.</strong> Giving a late bus a few extra seconds of green light keeps small delays from compounding.<a class="footnote-anchor" data-component-name="FootnoteAnchorToDOM" id="footnote-anchor-3" href="#footnote-3" target="_self">3</a></p></li></ol><div class="callout-block" data-callout="true"><h4><strong>&#128338; How we measured</strong></h4><p>We compared scheduled and actual arrival times for every weekday morning trip in August, using the agency’s published real-time feed. <em><strong>Updated September 24, 2026</strong></em></p></div><p>I wrote about the politics of bus lanes last spring, and the argument still holds:</p><div class="embedded-post-wrap" data-attrs="{&quot;id&quot;:171234567,&quot;url&quot;:&quot;https://example.org/p/who-owns-the-curb&quot;,&quot;publication_name&quot;:&quot;The Commonplace Dispatch&quot;}" data-component-name="EmbeddedPostToDOM"><a class="embedded-post" native="true" href="https://example.org/p/who-owns-the-curb"><div class="embedded-post-header"><img class="embedded-post-publication-logo" src="https://example.org/image/fetch/w_56,h_56/logo.png"><span class="embedded-post-publication-name">The Commonplace Dispatch</span></div><div class="embedded-post-title-wrapper"><div class="embedded-post-title">Who owns the curb? </div></div><div class="embedded-post-body">Every city street is a negotiation between people who want to park, people who want to load, and people who want to get through. The curb is where that negotiation gets loud&#8230;</div><div class="embedded-post-cta-wrapper"><span class="embedded-post-cta">Read more</span></div><div class="embedded-post-meta">5 months ago &#183; 212 likes &#183; 48 comments &#183; Morgan Halloway</div></a></div><p>An interactive chart, embedded as an iframe:</p><div id="datawrapper-iframe" class="datawrapper-wrap outer" data-attrs="{&quot;url&quot;:&quot;https://example.org/charts/dw-delay/1/&quot;}" data-component-name="DatawrapperToDOM"><iframe id="iframe-datawrapper" class="datawrapper-iframe" src="https://example.org/charts/dw-delay/1/" width="730" height="471" frameborder="0" scrolling="no"></iframe></div><div class="twitter-embed" data-attrs="{&quot;url&quot;:&quot;https://example.org/transit/status/1971234567&quot;}" data-component-name="Twitter2ToDOM"></div><blockquote><p><span>A schedule is a promise the agency makes to itself. A frequency is a promise it makes to riders.</span></p></blockquote><p><span>That line from a planner I interviewed has stuck with me. If you ride a route that runs often enough, the schedule stops mattering, and so does most of the slack.</span></p><p class="button-wrapper" data-attrs="{&quot;url&quot;:&quot;https://example.org/subscribe?&quot;,&quot;text&quot;:&quot;Subscribe now&quot;,&quot;action&quot;:null,&quot;class&quot;:null}" data-component-name="ButtonCreateButton"><a class="button primary" href="https://example.org/subscribe?"><span>Subscribe now</span></a></p><hr><p>Thanks for reading. Next week: why transfers feel twice as long as they are.</p><div class="footnote" data-component-name="FootnoteToDOM"><a id="footnote-1" href="#footnote-anchor-1" class="footnote-number" contenteditable="false" target="_self">1</a><div class="footnote-content"><p>Most riders, when asked, give a number within a minute or two of the route’s real average delay.</p></div></div><div class="footnote" data-component-name="FootnoteToDOM"><a id="footnote-2" href="#footnote-anchor-2" class="footnote-number" contenteditable="false" target="_self">2</a><div class="footnote-content"><p>The measurements come from a month of weekday mornings; evenings are <a href="https://example.org/p/the-evening-problem">a different story</a>.</p></div></div><div class="footnote" data-component-name="FootnoteToDOM"><a id="footnote-3" href="#footnote-anchor-3" class="footnote-number" contenteditable="false" target="_self">3</a><div class="footnote-content"><p>Signal priority works best on routes with long gaps between intersections. On a dense grid, the gains shrink.</p></div></div>'''

