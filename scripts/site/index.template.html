<!doctype html>
<!--
  Generated by scripts/build-site.py into docs/index.html. Edit this template, not the output.
  The hero is build/wordpress/new/hero.html, unchanged; its styles are the hero section of
  build/wordpress/daisy-examples.css. The releases come from docs/release-notes.json.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Daisy &amp; Daisy Sans for NetNewsWire</title>
<meta name="description" content="Two NetNewsWire themes with a cohesive house style across every feed you follow.">
<style>
:root {
  --canvas: #fff;
  --ink: #161616;
  --quiet: #5c5c5c;
  --rule: #e4e4e4;
  --accent: #f05a00;
  --button: #161616;
  --button-ink: #fff;
  --serif: ui-serif, "New York", Georgia, serif;
  --sans: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #121212;
    --ink: #ececec;
    --quiet: #a0a0a0;
    --rule: #2c2c2c;
    --accent: #ff7a2e;
    --button: #ececec;
    --button-ink: #121212;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--canvas);
  color: var(--ink);
  font: 1.0625rem / 1.6 var(--sans);
  margin: 0;
}
a { color: inherit; text-underline-offset: 0.2em; }
a:hover { color: var(--accent); }
.wrap { margin-inline: auto; max-width: 70rem; padding-inline: 1rem; }

/* Title block, from the Figma frame (Daisy, node 79:2495). Sizes are em of the title (129.674px
   in the frame, 1em here); letter-spacing is the frame's per-letter tracking, also in em. */
.top { padding-block: clamp(4rem, 12vw, 8.5rem) 0; text-align: center; }
.title {
  color: var(--ink);
  display: flex;
  flex-direction: column;
  font-size: min(8.96vw, 6.484rem);
  font-weight: 500;
  gap: 0.5em;
  margin: 0;
}
.title .line1, .title .line2 { display: block; text-box: trim-both cap alphabetic; white-space: nowrap; }
.title .line1 { line-height: 0.3246; }
.title .line2 { font-size: 0.461em; line-height: 0.9035; }
.ny { font-family: var(--serif); }
.sf { font-family: var(--sans); }
.ny700 { font-weight: 700; }
.line1 .sans { font-size: 0.9254em; font-variation-settings: "wdth" 116; font-weight: 800; }
.line1 .amp { font-size: 0.7301em; font-weight: 800; letter-spacing: -0.03em; }
.line1 .gap { font-weight: 510; letter-spacing: -0.02em; }
.line2 .lead { font-variation-settings: "wdth" 100; font-weight: 540; letter-spacing: -0.02em; }
.line2 .gap { font-variation-settings: "wdth" 129; font-weight: 567; letter-spacing: -0.03em; }
.line2 .ny { font-size: 1.0623em; font-weight: 600; }
.byline { color: var(--quiet); font-size: 1.0625rem; margin: 1.25rem 0 0; }
.sr { clip-path: inset(50%); height: 1px; overflow: hidden; position: absolute; width: 1px; }
.buttons { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin: clamp(1.5rem, 4vw, 2.5rem) 0 0; }
.button {
  background: var(--button);
  border-radius: 999px;
  color: var(--button-ink);
  font-weight: 600;
  padding: 0.7em 1.5em;
  text-decoration: none;
}
.button:hover { background: var(--accent); color: #fff; }
.button--serif { font-family: var(--serif); font-weight: 700; }

/* Hero: the block is pasted in as it is. */
.hero { margin-top: clamp(2.5rem, 8vw, 6rem); }

/* Updates */
.updates { border-top: 2px solid var(--ink); margin-top: clamp(2rem, 6vw, 4rem); padding-block: clamp(2rem, 6vw, 4rem) clamp(3rem, 8vw, 6rem); }
.updates > .wrap { max-width: 42rem; }
.updates h2 {
  font-family: var(--sans);
  font-size: clamp(1.7rem, 4vw, 2.4rem);
  font-variation-settings: "wght" 800, "wdth" 115;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin: 0 0 1.5rem;
}
.release { margin-bottom: 2.5rem; scroll-margin-top: 1.5rem; }
.release h3 { font-size: 1.25rem; font-weight: 700; line-height: 1.2; margin: 0; }
.release h3 a { text-decoration: none; }
.release time { color: var(--quiet); display: block; font-size: 0.9375rem; margin-top: 0.15rem; }
.release ul { margin: 0.9rem 0 0; padding-inline-start: 1.25rem; }
.release li { margin-block: 0.5em; text-wrap: pretty; }
.history { font-weight: 600; }
.footer { color: var(--quiet); font-size: 0.9375rem; margin-top: 3rem; }
</style>
<style>
/* The hero's styles, from build/wordpress/daisy-examples.css; the hero block's own overrides come after them. */
{{HERO_CSS}}
</style>
</head>
<body>
<header class="top wrap">
  <h1 class="title"><span class="sr">Daisy &amp; Daisy Sans. Clean up your feed</span>
    <span class="line1" aria-hidden="true"><span class="ny ny700" style="letter-spacing:-0.03em">D</span><span class="ny ny700">a</span><span class="ny ny700" style="letter-spacing:-0.01em">is</span><span class="ny ny700" style="letter-spacing:-0.05em">y</span><span class="ny ny700" style="letter-spacing:-0.06em"> </span><span class="ny amp">&amp;</span><span class="gap sf"> </span><span class="sans"><span class="sf" style="letter-spacing:-0.02em">D</span><span class="sf" style="letter-spacing:-0.01em">ai</span><span class="sf" style="letter-spacing:-0.02em">s</span><span class="sf">y </span><span class="sf" style="letter-spacing:-0.03em">S</span><span class="sf" style="letter-spacing:-0.02em">an</span><span class="sf">s</span></span></span>
    <span class="line2" aria-hidden="true"><span class="lead sf">Clean up</span><span class="gap sf"> </span><span class="ny" style="letter-spacing:-0.03em">y</span><span class="ny" style="letter-spacing:-0.04em">o</span><span class="ny" style="letter-spacing:-0.01em">u</span><span class="ny" style="letter-spacing:-0.03em">r</span><span class="ny" style="letter-spacing:-0.02em"> </span><span class="ny" style="letter-spacing:-0.03em">fee</span><span class="ny" style="letter-spacing:-0.02em">d</span></span></h1>
  <p class="byline">NetNewsWire themes by <a href="https://shanehendry.com/">Shane&nbsp;Hendry</a></p>
  <p class="buttons">
    <a class="button button--serif" href="install/?theme=daisy&amp;v={{LATEST}}">Install Daisy</a>
    <a class="button" href="install/?theme=daisy-sans&amp;v={{LATEST}}">Install Daisy Sans</a>
  </p>
</header>

<main>
<div class="wrap hero">
{{HERO}}
</div>

<section class="updates" id="updates">
  <div class="wrap">
    <h2>Updates</h2>
{{RELEASES}}
    <p class="history"><a href="https://github.com/shane-hendry/daisy/releases">Release history</a></p>
    <p class="footer"><a href="https://shanehendry.com/daisy">Daisy and Daisy Sans</a> are made by <a href="https://shanehendry.com/">Shane&nbsp;Hendry</a>.</p>
  </div>
</section>
</main>
</body>
</html>
