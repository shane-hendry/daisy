# nnw-theme-stub: release v2
name: Publish theme

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag beginning with v (for example, v1.0.0)
        required: true
        type: string
      notes:
        description: Optional release notes (default generated by git-cliff from .github/cliff.toml, if present)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: dave-atx/nnw-theme/.github/workflows/theme-release.yml@v2
    with:
      tag: ${{ inputs.tag }}
      notes: ${{ inputs.notes }}
