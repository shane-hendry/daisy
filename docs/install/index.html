<!doctype html>
<!--
  Adds a Daisy theme to NetNewsWire. The theme's update notice links here, because
  a link to netnewswire:// is not reliable inside an article. ?theme=daisy or
  ?theme=daisy-sans picks the theme and ?v=0.5.0 the release. The release zips are
  attached to the GitHub release itself: all of them are pre-releases, so the
  "latest" download address does not apply. The page does not open the app by itself:
  an automatic redirect closes the in-app browser on iPhone without showing the install
  prompt, so the person taps Install theme. The bullets come from release-notes.json
  (one entry per version, written by hand when a release is made). Served by GitHub
  Pages from docs/ on main.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Get the latest Daisy for NetNewsWire</title>
    <style>
      /* Styled after Daisy Sans: black text on white, system sans with variable weight and
         width, underlined black links, orange only on hover and focus. */
      :root {
        --canvas: #fff; --text: #161616; --accent: #f05a00; --on-text: #fff;
        --font: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
        --scale: 1;
        --title-weight: 800; --title-axes: "wght" 800, "wdth" 115; --title-stretch: 115%; --title-spacing: -0.02em;
        --head-weight: 700; --head-axes: "wght" 700, "wdth" 115; --h3-weight: 650; --h3-axes: "wght" 650, "wdth" 115; --head-stretch: 115%;
        --strong-weight: 700;
      }
      /* From Daisy (not Daisy Sans): the serif look. */
      :root.serif {
        --font: ui-serif, "New York", Georgia, serif;
        --scale: 1.05;
        --title-weight: 700; --title-axes: "opsz" 72; --title-stretch: 100%; --title-spacing: -0.02em;
        --head-weight: 620; --head-axes: normal; --h3-weight: 580; --h3-axes: normal; --head-stretch: 100%;
        --strong-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        :root { --canvas: #121212; --text: #ececec; --accent: #ff7a2e; --on-text: #121212; }
      }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 0 clamp(23px, 5vw, 55px);
        box-sizing: border-box; background: var(--canvas); color: var(--text);
        font: calc(1.0625rem * var(--scale))/1.6 var(--font); -webkit-text-size-adjust: 100%;
      }
      main { max-width: 32rem; padding: 3rem 0; }
      h1 {
        font-size: clamp(1.7em, 1.36em + 1.92vw, 2.05em); line-height: 1.15; margin: 0 0 1.75rem;
        font-weight: var(--title-weight); font-stretch: var(--title-stretch);
        font-variation-settings: var(--title-axes); letter-spacing: var(--title-spacing); text-wrap: balance;
      }
      h2 {
        font-size: 1.15em; margin: 2.25rem 0 0.75rem; text-align: center; line-height: 1.3;
        font-weight: var(--h3-weight); font-stretch: var(--head-stretch); font-variation-settings: var(--h3-axes);
      }
      p { margin: 0 0 1.5rem; }
      ul { margin: 0 0 2.25rem; padding-left: 1.25rem; }
      li { margin: 0 0 0.6rem; }
      li strong { font-weight: var(--strong-weight); }
      a { color: var(--text); text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
      @media (hover: hover) { a:hover { color: var(--accent); } }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .add {
        display: inline-block; padding: 0.7em 1.6em; background: var(--text); color: var(--on-text);
        font-weight: var(--head-weight); font-stretch: var(--head-stretch); font-variation-settings: var(--head-axes);
        text-decoration: none;
        border-radius: 0.4em; -webkit-tap-highlight-color: transparent;
      }
      @media (hover: hover) { .add:hover { background: var(--accent); color: var(--canvas); } }
      .credit { margin: 0; }
      .credit span { display: block; }
      #notes { text-align: left; }
    </style>
      <script>
      // Daisy shows the serif look; Daisy Sans (and anything else) the sans look.
      if (new URLSearchParams(location.search).get("theme") === "daisy") document.documentElement.classList.add("serif");
    </script>
  </head>
  <body>
    <main>
      <h1 id="title">Get the latest version of Daisy for NetNewsWire</h1>
      <p><a class="add" id="add" href="https://github.com/shane-hendry/daisy/releases">Install theme</a></p>
      <section id="notes" hidden>
        <h2 id="notes-title"></h2>
        <ul id="notes-list"></ul>
      </section>
      <p class="credit">
        <span>Daisy and Daisy Sans are made by <a href="https://shanehendry.com">Shane Hendry</a>.</span>
        <span><a href="https://shanehendry.com/daisy">Learn more about the themes.</a></span>
      </p>
    </main>
    <script>
      var params = new URLSearchParams(location.search);
      var themes = { daisy: ["Daisy", "Daisy.nnwtheme.zip"], "daisy-sans": ["Daisy Sans", "Daisy.Sans.nnwtheme.zip"] };
      var theme = themes[params.get("theme")];
      var version = params.get("v");
      if (theme && /^\d+(\.\d+){0,2}$/.test(version || "")) {
        var zip = "https://github.com/shane-hendry/daisy/releases/download/v" + version + "/" + theme[1];
        document.getElementById("title").textContent = "Get the latest version of " + theme[0] + " for NetNewsWire";
        document.title = "Get the latest " + theme[0] + " for NetNewsWire";
        document.getElementById("add").href = "netnewswire://theme/add?url=" + encodeURIComponent(zip);
        // The release notes are optional: without an entry for this version the list stays hidden.
        fetch("../release-notes.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (all) {
          var items = all && all[version];
          if (!items || !items.length) return;
          document.getElementById("notes-title").textContent = "Version " + version + " includes";
          var list = document.getElementById("notes-list");
          items.forEach(function (item) {
            var li = document.createElement("li");
            var b = document.createElement("strong");
            b.textContent = item.title;
            li.appendChild(b);
            li.appendChild(document.createTextNode(" " + item.text));
            list.appendChild(li);
          });
          document.getElementById("notes").hidden = false;
        }).catch(function () {});
      }
    </script>
  </body>
</html>
