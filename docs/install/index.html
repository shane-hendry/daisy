<!doctype html>
<!--
  Adds a Daisy theme to NetNewsWire. The theme's update notice links here, because
  a link to netnewswire:// is not reliable inside an article. ?theme=daisy or
  ?theme=daisy-sans picks the theme and ?v=0.5.0 the release. The release zips are
  attached to the GitHub release itself: all of them are pre-releases, so the
  "latest" download address does not apply. The page does not open the app by itself:
  an automatic redirect closes the in-app browser on iPhone without showing the install
  prompt, so the person taps the update link. The bullets come from release-notes.json
  (one entry per version, written by hand when a release is made). Served by GitHub
  Pages from docs/ on main.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Get the latest Daisy for NetNewsWire</title>
    <style>
      /* A replica of how the Daisy theme sets an article, so the page reads as part of the
         theme: the title and the link line under it, the release notes as the post body and
         a footer like "View original". Values are copied from the theme's stylesheet (Daisy
         Sans by default, the serif Daisy with the .serif class). */
      :root {
        color-scheme: light dark;
        --canvas: #fff; --text: #161616; --accent: #f05a00;
        --serif: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
        --serif-scale: 1;
        --title-weight: 800; --title-axes: "wght" 800, "wdth" 115;
        --link-weight: 450; --link-axes: "wght" 450, "wdth" 75;
        --weight-bold: 600;
        --title-gap: 1.05rem;
        --title-wide: clamp(2.15em, 1.37em + 2.2vw, 2.8em);
        --title-phone: clamp(1.7em, 1.36em + 1.92vw, 2.05em);
        --space-large: 3.84rem;
        --measure: 66ch;
        --gutter: clamp(23px, 5vw, 55px);
      }
      :root.serif {
        --serif: ui-serif, "New York", Georgia, serif;
        --serif-scale: 1.05;
        --title-weight: 700; --title-axes: "opsz" 72;
        --link-weight: 500; --link-axes: normal;
        --title-wide: clamp(2.4em, 1.55em + 2.48vw, 3.1em);
        --title-phone: clamp(1.7em, 1.36em + 2.02vw, 2.05em);
      }
      @media (prefers-color-scheme: dark) {
        :root { --canvas: #121212; --text: #ececec; --accent: #ff7a2e; }
      }
      html {
        -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none;
        background: var(--canvas); color: var(--text); font-family: var(--serif);
        font-size: calc(115% * var(--serif-scale)); font-weight: 400;
        letter-spacing: -0.008em; line-height: 1.7; overflow-wrap: break-word;
      }
      body { margin: 0; padding: clamp(28px, 6vw, 92px) var(--gutter); padding-bottom: max(clamp(28px, 6vw, 92px), var(--space-large)); }
      .article { margin: 0 auto; max-width: var(--measure); }
      [hidden] { display: none !important; }
      a { color: var(--text); text-decoration-thickness: max(1px, 0.055em); text-underline-offset: 0.2em; }
      @media (hover: hover) { a:hover { color: var(--accent); } }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      h1 {
        font-size: var(--title-wide); font-variation-settings: var(--title-axes); font-weight: var(--title-weight);
        letter-spacing: -0.02em; line-height: 1.1; margin: 0; text-box: trim-both cap alphabetic; text-wrap: balance;
      }
      @media (max-width: 600px) { h1 { font-size: var(--title-phone); } }

      /* The link line under the title. */
      .external-link { font-variation-settings: var(--link-axes); font-weight: var(--link-weight); margin-top: var(--title-gap); text-box: trim-both cap alphabetic; }

      /* The post body. */
      .articleBody { margin-top: var(--space-large); }
      ul { margin: 0; padding-inline-start: 1.5em; }
      li { margin-block: 0.4em; }
      li:first-child { margin-top: 0; text-box: trim-start cap alphabetic; }
      strong { font-weight: var(--weight-bold); }

      /* The footer, like "View original": plain links that underline on hover. */
      .view-post { margin-top: var(--space-large); text-box: trim-start cap alphabetic; }
      .view-post span { display: block; }
      .view-post a { text-decoration: none; }
      .view-post a:hover { text-decoration: underline; }
    </style>
    <script>
      // Daisy shows the serif look; Daisy Sans (and anything else) the sans look.
      if (new URLSearchParams(location.search).get("theme") === "daisy") document.documentElement.classList.add("serif");
    </script>
  </head>
  <body>
    <main class="article">
      <header>
        <h1 id="title">Get the latest version of Daisy for NetNewsWire</h1>
        <div class="external-link"><a id="add" href="https://github.com/shane-hendry/daisy/releases">Update</a></div>
      </header>
      <div class="articleBody"><ul id="notes-list"></ul></div>
      <footer class="view-post">
        <span>Daisy and Daisy Sans are made by <a href="https://shanehendry.com">Shane Hendry</a>.</span>
        <span><a href="https://shanehendry.com/daisy">Learn more about the themes.</a></span>
      </footer>
    </main>
    <script>
      var params = new URLSearchParams(location.search);
      var themes = { daisy: ["Daisy", "Daisy.nnwtheme.zip"], "daisy-sans": ["Daisy Sans", "Daisy.Sans.nnwtheme.zip"] };
      var theme = themes[params.get("theme")];
      var version = params.get("v");
      if (theme && /^\d+(\.\d+){0,2}$/.test(version || "")) {
        var zip = "https://github.com/shane-hendry/daisy/releases/download/v" + version + "/" + theme[1];
        var title = "Get the latest version of " + theme[0] + " for NetNewsWire";
        // NetNewsWire's in-app browser closes without installing, and a page cannot tell it from
        // Safari. So on an iPhone or iPad the page leads with the way out: open it in Safari.
        var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (ios) {
          title = "Open this page in Safari to update " + theme[0];
        }
        document.getElementById("title").textContent = title;
        document.title = "Get the latest " + theme[0] + " for NetNewsWire";
        document.getElementById("add").textContent = "Update to " + theme[0] + " " + version;
        document.getElementById("add").href = "netnewswire://theme/add?url=" + encodeURIComponent(zip);
        // The release notes are optional: without an entry for this version the list stays empty.
        fetch("../release-notes.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (all) {
          var items = all && all[version];
          if (!items || !items.length) return;
          var list = document.getElementById("notes-list");
          items.forEach(function (item) {
            var li = document.createElement("li");
            var b = document.createElement("strong");
            b.textContent = item.title;
            li.appendChild(b);
            li.appendChild(document.createTextNode(" " + item.text));
            list.appendChild(li);
          });
        }).catch(function () {});
      }
    </script>
  </body>
</html>
